<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Free Palestine</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }
    header {
      background-color: rgb(0, 100, 0);
      padding: 20px;
    }
    header h1 {
      color: #fff;
      margin: 0;
    }
    img {
      max-width: 90%;
      height: auto;
      margin: 20px 0;
      border: 4px solid red;
    }
    .message {
      font-size: 1.2em;
      margin: 20px auto;
      max-width: 800px;
    }
    .button {
      display: inline-block;
      padding: 12px 24px;
      background-color: red;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Free Palestine</h1>
  </header>
  <img src="https://upload.wikimedia.org/wikipedia/commons/0/00/Flag_of_Palestine.svg" alt="Palestinian Flag">
  <div class="message">
    <p>Palestinians deserve freedom, justice, and dignity. Stand in solidarity with the people of Palestine and raise your voice against oppression.</p>
  </div>
  <a href="https://www.un.org/unispal/" class="button" target="_blank">Learn More</a>
</body>
</html>
